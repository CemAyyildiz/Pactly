[package]
name = "pactly-escrow"
version = "0.1.0"
edition = "2021"
publish = false
description = "Pactly escrow contract: locks a booking deposit until release or cancellation."

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
soroban-sdk = "=27.0.6"

[dev-dependencies]
soroban-sdk = { version = "=27.0.6", features = ["testutils"] }

# Tuned for the smallest deployable wasm. Overflow checks stay on (amounts are i128).
[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
